<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Admin — Licente Craftelite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg:#0b0b0c; --fg:#e8e8ea; --muted:#9a9aa2; --accent:#6ee7b7; --danger:#f87171;
    --card:#16161a; --border:#232327; --input:#1e1e22;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f4f4f6; --fg:#15151a; --muted:#5c5c66; --card:#ffffff; --border:#e3e3e8; --input:#f0f0f3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px 30px; margin-bottom: 20px;
  }
  h1 { font-size: 1.1rem; margin: 0 0 20px; }
  label { display:block; font-size:0.78rem; color: var(--muted); margin-bottom:6px; margin-top:14px; }
  input {
    width:100%; background: var(--input); border:1px solid var(--border); color: var(--fg);
    padding:10px 12px; border-radius:8px; font-family: inherit; font-size:0.9rem;
  }
  button {
    margin-top:18px; width:100%; padding:11px; border-radius:8px; border:none;
    background: var(--accent); color:#06281c; font-weight:600; font-size:0.9rem; cursor:pointer;
    font-family: inherit;
  }
  button.secondary { background: transparent; border:1px solid var(--border); color: var(--fg); font-weight:500; }
  button.danger { background: var(--danger); color:#fff; }
  button.small { width:auto; padding:6px 10px; font-size:0.78rem; margin-top:0; }
  .msg { font-size:0.8rem; margin-top:10px; min-height: 1.2em; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  table { width:100%; border-collapse: collapse; margin-top: 16px; font-size: 0.82rem; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  th { color: var(--muted); font-weight:500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .pill { padding:2px 8px; border-radius:999px; font-size:0.72rem; display:inline-block; }
  .pill.valid { background: rgba(110,231,183,0.15); color: var(--accent); }
  .pill.invalid { background: rgba(248,113,113,0.15); color: var(--danger); }
  .actions button { margin: 0 4px 0 0; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px; }
  .muted { color: var(--muted); }
  #panelView { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div class="card" id="loginView">
    <h1>Autentificare admin</h1>
    <form id="loginForm">
      <label>Utilizator</label>
      <input type="text" id="loginUser" autocomplete="username" required>
      <label>Parola</label>
      <input type="password" id="loginPass" autocomplete="current-password" required>
      <button type="submit">Intra in panou</button>
      <div class="msg err" id="loginMsg"></div>
    </form>
  </div>

  <!-- PANEL -->
  <div id="panelView">
    <div class="card">
      <div class="top">
        <h1>Genereaza licenta noua</h1>
        <button class="secondary small" id="logoutBtn" type="button">Iesi</button>
      </div>
      <form id="createForm">
        <label>Domeniu client (ex: panoul-clientului.com)</label>
        <input type="text" id="domain" required placeholder="panoul-clientului.com">
        <div class="row">
          <div>
            <label>Zile valabilitate</label>
            <input type="number" id="days" value="30" min="1" required>
          </div>
          <div>
            <label>Nota (optional)</label>
            <input type="text" id="note" placeholder="ex: plata noiembrie">
          </div>
        </div>
        <button type="submit">Genereaza / reinnoieste licenta</button>
        <div class="msg" id="createMsg"></div>
      </form>
    </div>

    <div class="card">
      <h1>Licente existente</h1>
      <div class="msg muted" id="listMsg">Se incarca...</div>
      <table id="licTable" style="display:none">
        <thead>
          <tr><th>Domeniu</th><th>Expira</th><th>Status</th><th>Nota</th><th>Actiuni</th></tr>
        </thead>
        <tbody id="licBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

function showPanel() {
  $('loginView').style.display = 'none';
  $('panelView').style.display = 'block';
  loadLicenses();
}
function showLogin() {
  $('panelView').style.display = 'none';
  $('loginView').style.display = 'block';
}

async function checkSession() {
  const { data } = await api('/api/admin/session');
  if (data.authenticated) showPanel(); else showLogin();
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginMsg').textContent = '';
  const { ok, data } = await api('/api/admin/login', {
    method: 'POST',
    body: { username: $('loginUser').value, password: $('loginPass').value },
  });
  if (ok && data.ok) {
    showPanel();
  } else {
    $('loginMsg').textContent = 'Utilizator sau parola gresita.';
  }
});

$('logoutBtn').addEventListener('click', async () => {
  await api('/api/admin/logout', { method: 'POST' });
  showLogin();
});

$('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('createMsg');
  msg.className = 'msg';
  msg.textContent = 'Se salveaza...';

  const { ok, data } = await api('/api/admin/panel-create', {
    method: 'POST',
    body: {
      domain: $('domain').value.trim(),
      days: Number($('days').value),
      note: $('note').value.trim(),
    },
  });

  if (ok && data.ok) {
    msg.className = 'msg ok';
    msg.textContent = `Licenta activa pentru ${data.domain} pana la ${new Date(data.expires).toLocaleString('ro-RO')}.`;
    $('domain').value = '';
    $('note').value = '';
    loadLicenses();
  } else {
    msg.className = 'msg err';
    msg.textContent = 'Eroare: ' + (data.reason || 'necunoscuta');
  }
});

async function loadLicenses() {
  const listMsg = $('listMsg');
  const table = $('licTable');
  const body = $('licBody');

  listMsg.textContent = 'Se incarca...';
  table.style.display = 'none';

  const { ok, data } = await api('/api/admin/panel-list');
  if (!ok || !data.ok) {
    listMsg.textContent = 'Nu am putut incarca licentele.';
    return;
  }

  if (!data.licenses.length) {
    listMsg.textContent = 'Nicio licenta creata inca.';
    return;
  }

  listMsg.textContent = '';
  body.innerHTML = '';

  data.licenses.forEach((lic) => {
    const expired = lic.expires && Date.now() > lic.expires;
    const invalid = lic.revoked || expired;
    const tr = document.createElement('tr');

    const expiresStr = lic.expires ? new Date(lic.expires).toLocaleDateString('ro-RO') : '-';
    const statusLabel = lic.revoked ? 'revocata' : (expired ? 'expirata' : 'valida');

    tr.innerHTML = `
      <td>${lic.domain}</td>
      <td>${expiresStr}</td>
      <td><span class="pill ${invalid ? 'invalid' : 'valid'}">${statusLabel}</span></td>
      <td class="muted">${lic.note || ''}</td>
      <td class="actions"></td>
    `;

    const actionsCell = tr.querySelector('.actions');

    if (lic.revoked) {
      const reactivateBtn = document.createElement('button');
      reactivateBtn.className = 'secondary small';
      reactivateBtn.textContent = 'Reactiveaza';
      reactivateBtn.onclick = () => doAction('panel-reactivate', lic.domain);
      actionsCell.appendChild(reactivateBtn);
    } else {
      const revokeBtn = document.createElement('button');
      revokeBtn.className = 'danger small';
      revokeBtn.textContent = 'Revoca';
      revokeBtn.onclick = () => doAction('panel-revoke', lic.domain);
      actionsCell.appendChild(revokeBtn);
    }

    body.appendChild(tr);
  });

  table.style.display = 'table';
}

async function doAction(endpoint, domain) {
  await api(`/api/admin/${endpoint}`, { method: 'POST', body: { domain } });
  loadLicenses();
}

checkSession();
</script>
</body>
</html>
